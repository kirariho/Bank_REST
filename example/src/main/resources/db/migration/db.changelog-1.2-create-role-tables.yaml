databaseChangeLog:
  - changeSet:
      id: 3-create-roles-table
      author: postgres
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: roles
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: true 
                    unique: true 
  - changeSet:
      id: 4-create-user-roles-table
      author: postgres
      preConditions:
         onFail: MARK_RAN
         and:
          - tableExists:
              tableName: users
          - tableExists:
              tableName: roles
          - not:
            tableExists:
              tableName: user_roles
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
  - changeSet: 
      id: 4-create-user-roles-index
      author: postgres
      preConditions:
        onFail: MARK_RAN
        and:
          - sqlCheck:
              expectedResult: 1 
              sql: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'user_roles'
          - not:
            indexExists:
              indexName: idx_user_roles_user_role
      changes:
        - createIndex:
            tableName: user_roles
            indexName: idx_user_roles_user_role
            columns:
              - column:
                  name: user_id
              - column:
                  name: role_id