databaseChangeLog:
  - changeSet:
      id: 3-create-roles-table
      author: postgres
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: true  
  - changeSet:
      id: 3-update-roles-name
      author: postgres
      changes:
        - sql:
            sql: UPDATE roles SET name = 'DEFAULT' WHERE name IS NULL;
  - changeSet:
      id: 3-add-not-null-constraint
      author: postgres
      changes:
        - addNotNullConstraint:
            tableName: roles
            columnName: name
            columnDataType: VARCHAR(50)
  - changeSet:
      id: 3-add-unique-constraint
      author: postgres
      changes:
        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: uk_roles_name
  - changeSet:
      id: 4-create-user-roles-table
      author: postgres
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: users
        - tableExists:
            tableName: roles
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
  - changeSet: 
      id: 4-create-user-roles-index
      author: postgres
      changes:
        - createIndex:
            tableName: user_roles
            indexName: idx_user_roles_user_role
            columns:
              - column:
                  name: user_id
              - column:
                  name: role_id