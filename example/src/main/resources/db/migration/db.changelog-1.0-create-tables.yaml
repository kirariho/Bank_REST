databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: postgres
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
  - changeSet:
      id: 2-create-cards-table
      author: postgres
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: cards
      changes:
        - createTable:
            tableName: cards
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: card_number_encrypted
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: NUMERIC(15,2)
                  defaultValueNumeric: 0.00
  - changeSet:
      id: 2-add-cards-foreign-key
      author: postgres
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: cards
          - tableExists:
              tableName: users
          - not:
              foreignKeyConstraintExists:
                foreignKeyName: fk_cards_owner
      changes:
        - addForeignKeyConstraint:
            baseTableName: cards
            baseColumnNames: owner_id  
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_cards_owner