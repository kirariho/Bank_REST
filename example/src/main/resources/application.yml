spring:
  application:
    name: card-management-system
  # security:
  #   user:
  #     password: encoder: bcrypt
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # или validate/create/drop, если нужно
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        connection:
          characterEncoding: utf8
          collation: utf8_general_ci

  liquibase:
    drop-first: true
    enabled: true
    change-log: classpath:/db/migration/db.changelog-master.yaml

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET_KEY}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorted: alpha
    operation-sorted: method
